[loggers]
keys=root
[handlers]
keys=bounded
[formatters]
keys=plain
[logger_root]
level=INFO
handlers=bounded
[handler_bounded]
class=handlers.RotatingFileHandler
level=INFO
formatter=plain
args=('/run/nanfo/controller.log', 'a', 262144, 1)
[formatter_plain]
format=%(asctime)s %(levelname)s %(name)s %(message)s
