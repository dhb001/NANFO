<svg xmlns="http://www.w3.org/2000/svg" width="600" height="681" viewBox="0 0 600 681"><defs/><rect width="600" height="681" fill="#fff"/><rect x="166" y="8" width="268" height="54" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="300" y="42">Operator browser</text></g><rect x="8" y="102" width="584" height="570" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="16px"><text x="300" y="129">Local deployment host</text></g><rect x="172" y="147" width="258" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="301" y="181.5">Frontend gateway</text></g><rect x="23" y="241" width="554" height="208" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" font-weight="bold" pointer-events="none" text-anchor="middle" font-size="16px"><text x="300" y="260">Private application network</text></g><rect x="42" y="282" width="211" height="59" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="147.5" y="318.5">One API process</text></g><rect x="337" y="282" width="221" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="447.5" y="308">Independent workers</text><text x="447.5" y="327">Execution, autonomy, simulation,</text><text x="447.5" y="346">override, report and alert</text></g><rect x="135" y="383" width="347" height="57" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="308.5" y="409">Private stores: PostgreSQL / Neo4j / Redis</text><text x="308.5" y="428">Owned records / topology / sessions and streams</text></g><rect x="23" y="497" width="270" height="83" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="158" y="536">Shared handoff volumes</text><text x="158" y="555">Commands · snapshots · results</text></g><rect x="343" y="497" width="230" height="83" fill="#ffffff" stroke="#000000" stroke-width="1.6" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="458" y="536">Optional privileged lab</text><text x="458" y="555">network_mode: none</text></g><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="72" y="54.5">Loopback</text><text x="72" y="73.5">:8787</text><text x="72" y="92.5">HTTP / WS</text></g><path d="M 223.6 202 L 148 224 L 147.5 282" fill="none" stroke="#000000" stroke-width="1.6" stroke-miterlimit="10" pointer-events="none"/><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="253" y="230.5">HTTP / WS</text></g><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="292.5" y="471.5">Execution worker: command writer; snapshot/result reader</text></g><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="332" y="605.5">Lab: read commands; write snapshots/results</text></g><g fill="#000000" font-family="Times New Roman" pointer-events="none" text-anchor="middle" font-size="16px"><text x="300" y="624.5">Persistent volumes: relational, graph, Redis and report data.</text><text x="300" y="643.5">Trusted bindings and approved model files are separate read-only mounts.</text><text x="300" y="662.5">API and workers have no Docker socket or direct host-switch access.</text></g><path d="M 166 35 L 146 35 L 146 172 L 172 174.5" fill="none" stroke="#000000" stroke-width="1.6" stroke-miterlimit="10" pointer-events="none"/><path d="M 147.5 341 L 187.05 383" fill="none" stroke="#000000" stroke-width="1.6" stroke-miterlimit="10" pointer-events="none"/><path d="M 447.5 358 L 429.95 383" fill="none" stroke="#000000" stroke-width="1.6" stroke-miterlimit="10" pointer-events="none"/><path d="M 558 320 L 581 320 L 581 487 L 158 487 L 158 497" fill="none" stroke="#000000" stroke-width="1.6" stroke-miterlimit="10" pointer-events="none"/><path d="M 293 538.5 L 343 538.5" fill="none" stroke="#000000" stroke-width="1.6" stroke-miterlimit="10" pointer-events="none"/></svg>