name: Production full-stack regressions

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      NEO4J_IMAGE: neo4j:5.26.12-community-bullseye@sha256:9f75e8df4325a24f00fdd7a8c0bcce650a58375049b1058e496e8b43d6c36b37
      REDIS_IMAGE: redis:7.4.5-bookworm@sha256:90e7a336d044f1abc9e9dbc05d65566850896d11453bbd1dd0fb7e5059f0e8fb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked backend and browser tooling
        run: |
          python -m pip install poetry==2.4.1
          poetry -C backend check --lock
          poetry -C backend sync --with dev --no-root --no-interaction
          npm ci --prefix frontend --no-audit --no-fund
      - name: Browser and full-stack harness contracts
        run: |
          poetry -C backend run pytest scripts/test_review_fullstack.py --no-cov -q
          frontend/node_modules/.bin/tsc -p frontend/tests/fullstack/tsconfig.json --noEmit
          frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Provision runner-only prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql
          pg_config --bindir >> "$GITHUB_PATH"
          mkdir -p /tmp/opencode
          docker pull "$NEO4J_IMAGE"
          docker pull "$REDIS_IMAGE"
          printf 'R09_NEO4J_IMAGE_ID=%s\n' "$(docker image inspect --format '{{.Id}}' "$NEO4J_IMAGE")" >> "$GITHUB_ENV"
          printf 'R09_REDIS_IMAGE_ID=%s\n' "$(docker image inspect --format '{{.Id}}' "$REDIS_IMAGE")" >> "$GITHUB_ENV"
      - name: Real authenticated HTTP, stores, workers and production assets (zero skips)
        working-directory: backend
        run: >-
          poetry run python -m scripts.review_fullstack
          --neo4j-image-id "$R09_NEO4J_IMAGE_ID"
          --redis-image-id "$R09_REDIS_IMAGE_ID"
          --report "$RUNNER_TEMP/r09-fullstack.json" --timeout 900
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fullstack-sanitized-result
          path: ${{ runner.temp }}/r09-fullstack.json
          retention-days: 7
