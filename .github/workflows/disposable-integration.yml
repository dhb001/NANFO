name: Disposable database integration

# Bounded database fixtures only; no privileged network lab or shared stores.
# No `paths:` filter: database-contracts and migrations are required checks and
# must report on every pull request (a filtered workflow never reports).
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_database_tests:
        description: Run PostgreSQL and Redis fixtures on disposable hosted-runner services
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Store images are the exact production pins (deploy/compose.yaml, deploy/Dockerfile.redis).
jobs:
  stream-retention:
    name: stream-retention
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      REDIS_IMAGE: redis:7.4.11-bookworm@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install locked backend environment
        id: install
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry sync --with dev --no-root --no-interaction
      - name: Provide exact Redis image to owned disposable fixture
        run: |
          mkdir -p /tmp/opencode
          docker pull "$REDIS_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$REDIS_IMAGE")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'STREAM_RETENTION_TEST_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"
      - name: Real Redis retention races, archive recovery and bounded capacity
        run: >-
          poetry run pytest tests/integration/test_stream_retention_redis.py
          --no-cov -q --junitxml=stream-retention-results.xml
      - name: Require all retention cases executed with zero skips
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python ../.github/scripts/ci_gates.py junit stream-retention-results.xml --zero-skips --min-cases 29
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stream-retention-results
          path: backend/stream-retention-results.xml
          retention-days: 7

  migrations:
    name: migrations
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_database_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_USER: nanfo_test
          POSTGRES_DB: nanfo_migrations
          POSTGRES_PASSWORD: nanfo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U nanfo_test -d nanfo_migrations"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      # Alembic reads the DSN from Settings. Public, job-local fixture values only;
      # Neo4j/Redis are required Settings fields but are never contacted by Alembic.
      APP_ENV: test
      NANFO_SERVICE_ROLE: worker
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: nanfo_test
      POSTGRES_PASSWORD: nanfo_test
      POSTGRES_DB: nanfo_migrations
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: unused
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install locked backend environment
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry sync --with dev --no-root --no-interaction
      - name: Point Settings at the disposable PostgreSQL 17 service
        env:
          SERVICE_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: printf 'POSTGRES_PORT=%s\n' "$SERVICE_PORT" >> "$GITHUB_ENV"
      - name: Require PostgreSQL 17 (production major)
        run: |
          poetry run python - <<'PY'
          import os
          import psycopg2

          connection = psycopg2.connect(host=os.environ["POSTGRES_HOST"], port=os.environ["POSTGRES_PORT"],
                                        user=os.environ["POSTGRES_USER"], password=os.environ["POSTGRES_PASSWORD"],
                                        dbname=os.environ["POSTGRES_DB"])
          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_setting('server_version_num')::int")
                  version = cursor.fetchone()[0]
          finally:
              connection.close()
          assert 170000 <= version < 180000, version
          print(f"PostgreSQL server_version_num={version}")
          PY
      - name: Single migration head
        run: |
          heads="$(poetry run alembic -c alembic/alembic.ini heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
      - name: alembic upgrade head
        run: poetry run alembic -c alembic/alembic.ini upgrade head
      - name: alembic check (models and migrations agree)
        run: poetry run alembic -c alembic/alembic.ini check
      # Historical migrations deliberately refuse downgrade (ADR-028 BE-DB guards), so
      # the round trip exercises the newest revision: head -> previous -> head.
      - name: Downgrade/upgrade round trip of the newest revision
        run: |
          poetry run alembic -c alembic/alembic.ini downgrade -1
          poetry run alembic -c alembic/alembic.ini current
          poetry run alembic -c alembic/alembic.ini upgrade head
      - name: alembic check after the round trip
        run: poetry run alembic -c alembic/alembic.ini check

  database-contracts:
    name: database-contracts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_database_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_USER: nanfo_test
          POSTGRES_DB: nanfo_test
          POSTGRES_PASSWORD: nanfo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U nanfo_test -d nanfo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.11-bookworm@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      # Every suite that reads a *_TEST_DSN / *_TEST_REDIS_URL runs here with zero skips.
      # The drift guard below fails when a new DSN-gated suite is not listed.
      DATABASE_SUITES: >-
        tests/integration/test_intent_execution_postgres.py
        tests/integration/test_report_postgres.py
        tests/integration/test_autonomy_postgres.py
        tests/integration/test_autonomy_operator_postgres.py
        tests/integration/test_simulation_postgres.py
        tests/integration/test_alert_postgres.py
        tests/integration/test_plugin_postgres.py
        tests/integration/test_telemetry_history_sql.py
        tests/integration/test_login_rate_limit_redis.py
        tests/integration/test_network_outbox_postgres.py
        tests/integration/test_spatial_postgres.py
        tests/integration/test_asset_postgres.py
        tests/integration/test_telemetry_lifecycle_postgres.py
        tests/integration/test_retention_complete_postgres.py
        tests/integration/test_experimental_retention_postgres.py
        tests/integration/test_fleet_postgres.py
        tests/integration/test_autonomous_execution_postgres.py
        tests/integration/test_experimental_lab_postgres.py
        tests/integration/test_network_inventory_postgres.py
        tests/integration/test_identity_audit_repair_postgres.py
        tests/integration/test_alert_scope_postgres.py
        tests/integration/test_workflow_history_postgres.py
        tests/integration/test_migrations_postgres.py
        scripts/test_audit_role_profiles.py
        scripts/test_audit_http_smoke.py
      # Not run here: private fleet/local-SNMP opt-in lane; audit runner self-tests (backend job).
      DATABASE_SUITES_EXEMPT: >-
        tests/integration/test_fleet_local_snmp.py
        scripts/test_audit_isolated_suite.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Every DSN-gated suite is executed by this job (drift guard)
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          listed = set(os.environ["DATABASE_SUITES"].split())
          exempt = set(os.environ["DATABASE_SUITES_EXEMPT"].split())
          gated = {
              path.as_posix()
              for pattern in ("tests/integration/test_*.py", "tests/unit/test_*.py", "scripts/test_*.py")
              for path in Path(".").glob(pattern)
              if re.search(r"\b[A-Z][A-Z0-9_]*_TEST_(?:DSN|REDIS_URL)\b", path.read_text(encoding="utf-8"))
          }
          missing = sorted(gated - listed - exempt)
          stale = sorted((listed | exempt) - gated)
          assert not missing, f"DSN-gated suites not executed by database-contracts: {missing}"
          assert not stale, f"database-contracts lists suites that are absent or not DSN-gated: {stale}"
          print(f"{len(listed)} DSN-gated suites listed; exempt: {sorted(exempt)}")
          PY
      - name: Install locked backend test environment
        id: install
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry sync --with dev --no-root --no-interaction
      - name: Bound database lock and statement waits on the disposable service
        env:
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          poetry run python - <<'PY'
          import os
          import psycopg2

          connection = psycopg2.connect(host='127.0.0.1', port=os.environ['PGPORT'],
              user='nanfo_test', password='nanfo_test', dbname='nanfo_test')
          try:
              connection.autocommit = True
              with connection.cursor() as cursor:
                  cursor.execute("ALTER SYSTEM SET lock_timeout = '30s'")
                  cursor.execute("ALTER SYSTEM SET statement_timeout = '120s'")
                  cursor.execute('SELECT pg_reload_conf()')
                  assert cursor.fetchone()[0]
          finally:
              connection.close()
          PY
      - name: Verify declared fakeredis Lua support before database contracts
        run: poetry run python ../scripts/check_fakeredis_lua.py
      - name: Disposable-schema migrations, transactions, recovery and Redis gates
        env:
          # Public fixture credentials, usable only for this disposable runner service.
          INTENT_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          REPORT_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          AUTONOMY_TEST_DSN: postgresql+asyncpg://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          RETENTION_TEST_DSN: postgresql+asyncpg://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          FLEET_TEST_DSN: postgresql+asyncpg://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          SIMULATION_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          ALERT_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          PLUGIN_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          TELEMETRY_TEST_DSN: postgresql+asyncpg://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          NETWORK_OUTBOX_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          SPATIAL_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          ASSET_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          EXPERIMENTAL_TEST_DSN: postgresql+asyncpg://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          AUDIT_TEST_DSN: postgresql+asyncpg://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          IDENTITY_TEST_DSN: postgresql+asyncpg://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          MIGRATION_TEST_DSN: postgresql+psycopg2://nanfo_test:nanfo_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/nanfo_test
          INTENT_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
          REPORT_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/1
          AUTH_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/2
          AUDIT_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/3
          AUDIT_HTTP_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/4
        run: |
          # shellcheck disable=SC2086 # word splitting of the explicit suite list is intended
          poetry run pytest --no-cov -q --junitxml=database-results.xml $DATABASE_SUITES
      - name: Require executed database and Redis cases (no silent opt-in skips)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python ../.github/scripts/ci_gates.py junit database-results.xml --zero-skips --min-cases 314
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: disposable-database-results
          path: backend/database-results.xml
          retention-days: 7
