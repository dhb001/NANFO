name: Evidence hygiene

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-hygiene:
    name: Credential and evidence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Test scanner, export, policy and portable Git gate
        run: python -m unittest discover -s scripts -p test_evidence_hygiene.py -v
      - name: Scan every tracked file and nested archive with reviewed exact fixture policy
        run: python scripts/evidence_hygiene.py scan --root . --tracked --fixtures security/evidence-fixtures.v1.json
