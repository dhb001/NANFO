name: Evidence hygiene

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence-hygiene:
    name: evidence-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Pinned release binary, verified by SHA-256 before use (supply-chain pin).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history on every branch/tag reachable from the clone for the history scan.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Test scanner, export, policy and portable Git gate
        run: python -m unittest discover -s scripts -p test_evidence_hygiene.py -v
      - name: Scan every tracked file and nested archive with reviewed exact fixture policy
        if: ${{ !cancelled() }}
        # Location exceptions: only the 10 owner-approved, SHA-256-pinned campaign-014
        # deploy/state copies (security/evidence-location-exceptions.v1.json).
        run: >-
          python scripts/evidence_hygiene.py scan --root . --tracked
          --fixtures security/evidence-fixtures.v1.json
          --location-exceptions security/evidence-location-exceptions.v1.json
      - name: Install pinned gitleaks
        id: gitleaks
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version
      - name: Secret scan of the entire Git history (all refs)
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        # .gitleaks.toml detects bare receiver-token files and allowlists ONLY the 71
        # expired tokens of commit 3f9f1f1 (history rewrite is an owner action, ADR-028 §5);
        # .gitleaksignore pins individually reviewed historical false positives.
        run: >-
          "$RUNNER_TEMP/bin/gitleaks" git --log-opts="--all" --config .gitleaks.toml
          --gitleaks-ignore-path .gitleaksignore --redact --no-banner --exit-code 1 .
