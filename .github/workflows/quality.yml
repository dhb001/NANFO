name: Quality gates

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Independent gates run even after an earlier gate failed (`!cancelled()` plus an
# explicit install check), so one red step never hides another result.
jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      # Coverage floor = measured baseline - 1 point (ADR-028): CI's exact command
      # (tests/unit tests/integration, -m "not private_artifacts") measured 85.60% total
      # on 2026-09-25, so the floor is 84. Raise it with the baseline, never lower it.
      COVERAGE_FLOOR: '84'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install locked backend environment
        id: install
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry sync --with dev --no-root --no-interaction
          poetry run python -m pip check
      - name: Verify declared fakeredis Lua support in the clean locked environment
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: poetry run python ../scripts/check_fakeredis_lua.py
      - name: Backend lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: poetry run ruff check app tests scripts
      - name: Disposable audit runner isolation and evidence regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: poetry run pytest scripts/test_audit_isolated_suite.py --no-cov -q
      - name: Unit and service-contract tests (portable; private evidence deselected)
        id: portable
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Tests listed in tests/private_artifacts.txt need the ignored ai-engine/artifacts
        # store; they are marked `private_artifacts` by tests/conftest.py (ADR-028).
        run: >-
          poetry run pytest tests/unit tests/integration -q -m "not private_artifacts"
          --junitxml=quality-results.xml --cov-report=xml:coverage.xml --cov-fail-under="$COVERAGE_FLOOR"
      - name: Explicit skip budget (every allowlisted reason executes in another lane)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          python ../.github/scripts/ci_gates.py junit quality-results.xml
          --budget ../.github/ci-skip-budget.json --lane backend --min-cases 4500
      - name: Full portable deployment, emulation, root-script and CI-gate regressions (zero skips)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: poetry run python ../scripts/run_portable_tests.py --junitxml=portable-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-quality-results
          path: |
            backend/quality-results.xml
            backend/coverage.xml
            backend/portable-results*.xml
          retention-days: 7

  gateway-proxy-boundary:
    name: gateway-proxy-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install locked backend environment
        id: install
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry sync --with dev --no-root --no-interaction
      - name: Install local gateway test binary
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nginx
      - name: Real nginx authentication proxy boundary
        run: >-
          poetry run pytest --no-cov -q --junitxml=proxy-results.xml
          tests/unit/test_proxy_boundary.py::test_real_nginx_two_login_clients_and_untrusted_spoof
      - name: Require the executed real nginx case with zero skips
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          python ../.github/scripts/ci_gates.py junit proxy-results.xml --zero-skips
          --require test_real_nginx_two_login_clients_and_untrusted_spoof
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gateway-proxy-boundary-results
          path: backend/proxy-results.xml
          retention-days: 7

  gateway-headers:
    name: gateway-headers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install locked backend environment
        id: install
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry sync --with dev --no-root --no-interaction
      - name: Install local gateway test binary
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nginx
      - name: Gateway response headers through the real deploy/nginx.conf
        env:
          NANFO_TEST_NGINX: '1'
        run: poetry run pytest tests/integration/test_gateway_headers.py --no-cov -q --junitxml=gateway-results.xml
      - name: Require executed gateway header cases with zero skips
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python ../.github/scripts/ci_gates.py junit gateway-results.xml --zero-skips --min-cases 13
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gateway-headers-results
          path: backend/gateway-results.xml
          retention-days: 7

  ai:
    name: ai
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-engine
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_PROJECT_ENVIRONMENT: .venv-ci
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ai-engine/.python-version
      - name: Install separate locked CPU AI environment
        id: install
        run: |
          python -m pip install uv==0.8.22
          uv sync --locked --group dev --python "$(command -v python)"
          uv pip check --python .venv-ci/bin/python
      - name: Verify backend export schemas need only AI dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          uv run --no-sync python -I - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          backend_only = ("sqlalchemy", "fastapi", "pydantic_settings", "redis", "asyncpg")
          assert all(importlib.util.find_spec(name) is None for name in backend_only)
          sys.path.insert(0, str(Path.cwd().parent / "backend"))
          from app.modules.autonomy.model_diagnostic_schemas import (
              ModelDiagnosticRecord,
              ModelDiagnosticsResponse,
          )

          assert ModelDiagnosticRecord.model_fields and ModelDiagnosticsResponse.model_fields
          PY
      - name: AI lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff check src tests scripts/shadow scripts/shadow_evaluate.py scripts/agent_runtime
      - name: AI unit tests (every suite; no live training or lab launcher)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # The environment spec is the hashed tracked fixture (tests/fixtures). Only the
        # modules in tests/private_artifacts.txt need ai-engine/artifacts; without it they
        # skip with one explicit reason, allowlisted per module in the skip budget.
        run: uv run --no-sync pytest -q --junitxml=quality-results.xml
      - name: Explicit skip budget (only the registered private-evidence modules may skip)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          python ../.github/scripts/ci_gates.py junit quality-results.xml
          --budget ../.github/ci-skip-budget.json --lane ai --min-cases 440
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ai-quality-results
          path: ai-engine/quality-results.xml
          retention-days: 7

  # Not a required check: committed frontend contract types
  # (frontend/src/shared/types/generated/openapi.ts) must equal the backend's OpenAPI.
  api-contract:
    name: api-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked backend and frontend tooling
        run: |
          python -m pip install poetry==2.4.1
          poetry -C backend check --lock
          poetry -C backend sync --with dev --no-root --no-interaction
          npm ci --prefix frontend --no-audit --no-fund
      - name: Generated OpenAPI types match the backend schema (npm run api:check)
        working-directory: frontend
        env:
          # Inert placeholders so app.main imports under APP_ENV=test; nothing is contacted.
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_USER: nanfo_ci
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: nanfo_ci
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: unused
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: unused
        run: |
          # The API role needs a signing key to import; this one is random and discarded.
          JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')" npm run api:check

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend lock
        id: install
        run: npm ci --no-audit --no-fund
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Production build and existing bundle budgets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run perf:bundle
      - name: Install lock-matched browser
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --no-install playwright install --with-deps chromium
      - name: Chromium contract and CSP regressions
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:e2e -- --project=chromium --retries=0 --workers=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: frontend-browser-failure-results
          path: frontend/test-results
          retention-days: 7
