name: Dependency security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-inventories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [backend, ai, ai-upstream, emulation]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install audit tool only (no application or frozen environment install)
        run: python -m pip install pip-audit==2.10.0
      - name: Verify fail-closed policy behavior
        run: python -m unittest discover -s scripts -p test_audit_dependencies.py -v
      - name: Audit every exact runtime and development pin
        run: python scripts/audit_dependencies.py '${{ matrix.lane }}' --output audit-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit-${{ matrix.lane }}
          path: audit-results/
          retention-days: 14

  npm-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
      - name: Reproduce lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production and development (all severities fail)
        run: npm audit --audit-level=low --json > npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit-npm
          path: frontend/npm-audit.json
          retention-days: 14
