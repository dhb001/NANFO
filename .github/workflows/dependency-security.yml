name: Dependency security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-inventory:
    name: python-inventory (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [backend, ai, ai-upstream, emulation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install audit tool only (no application or frozen environment install)
        run: python -m pip install pip-audit==2.10.0
      - name: Verify fail-closed policy behavior (incl. stale exception detection)
        run: python -m unittest discover -s scripts -p test_audit_dependencies.py -v
      - name: Audit every exact runtime and development pin
        run: python scripts/audit_dependencies.py '${{ matrix.lane }}' --output audit-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit-${{ matrix.lane }}
          path: audit-results/
          retention-days: 14

  # Stable required-check name: matrix legs report as "python-inventory (<lane>)".
  python-inventories:
    name: python-inventories
    if: ${{ always() }}
    needs: [python-inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every Python inventory lane passed
        env:
          RESULT: ${{ needs.python-inventory.result }}
        run: |
          echo "python-inventory matrix result: $RESULT"
          test "$RESULT" = success

  npm-lock:
    name: npm-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Reproduce lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production and development (all severities fail)
        run: npm audit --audit-level=low --json > npm-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit-npm
          path: frontend/npm-audit.json
          retention-days: 14
