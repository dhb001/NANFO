# Included by deploy/nginx.conf in every proxied location (proxy_set_header, like
# add_header, is inherited only into levels that define none).
proxy_pass http://nanfo_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# C1: the WebSocket subprotocols (nanfo.v1 + bearer entry) are forwarded explicitly.
proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
# Exactly one hop: the API trusts only this gateway (FORWARDED_ALLOW_IPS) and sees the
# client address resolved by realip, never a client-supplied chain or scheme.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $nanfo_forwarded_proto;
proxy_set_header X-Request-ID $nanfo_request_id;
proxy_read_timeout 65s;
# Token-bearing API responses are never compressed at the edge (BREACH).
gzip off;
