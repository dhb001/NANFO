# Explicitly opt-in (`manage.py lab start`); never part of the default lifecycle.
# ADR-028 C23 successor lab: no privileged mode, only the namespace capabilities a
# Mininet/OVS/FRR lab needs, no network, no new privileges, read-only root with
# nosuid/nodev scratch. It is a new runtime: results require fresh qualification.
# The frozen privileged EOL image is available only via compose.lab.frozen.yaml.
services:
  lab:
    image: ${NANFO_LAB_IMAGE:?Set the operator-verified successor lab image digest or sha256 image ID}
    profiles: [lab]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    # Root without DAC_OVERRIDE: it owns its output/result volumes (root:10001 0750)
    # and reads 0640 command files through the nanfo group (volume_init.LAYOUT).
    group_add: ["10001"]
    environment:
      EMULATION_CONTROL_ENABLED: ${EMULATION_CONTROL_ENABLED:-false}
      EMULATION_BINDING_DIGEST: ${EMULATION_BINDING_DIGEST:-}
      # C15: verifies mailbox command MACs; root-owned 0400 copy (lab_secrets volume).
      NANFO_LAB_COMMAND_KEY_FILE: /run/nanfo-lab-key/lab_command_key
    volumes:
      - lab_output:/output
      - lab_commands:/commands:ro
      - lab_results:/results
      - lab_secrets:/run/nanfo-lab-key:ro
    tmpfs:
      - /run:rw,exec,nosuid,nodev,size=64m,mode=0755
      - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
      - /var/run/openvswitch:rw,nosuid,nodev,size=16m,mode=0750
      - /var/lib/openvswitch:rw,nosuid,nodev,size=32m,mode=0750
      - /etc/openvswitch:rw,nosuid,nodev,size=8m,mode=0750
      - /var/log:rw,noexec,nosuid,nodev,size=32m,mode=0755
    pids_limit: 256
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 30s
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "2"}
    healthcheck:
      test: [CMD, python, -m, emulation.runner, --request, status]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
