name: ${NANFO_PROJECT:?Use deploy/manage.py init first}

x-logging: &logging
  driver: json-file
  options: {max-size: 5m, max-file: "3"}

# Shared non-secret settings. Every backend-image service states APP_ENV and
# NANFO_SERVICE_ROLE explicitly (ADR-028: APP_ENV defaults to production and the
# worker role never receives or requires the JWT signing key, C10/C24).
x-environment: &environment
  APP_ENV: production
  NANFO_SERVICE_ROLE: worker
  EXECUTION_MODE: ${EXECUTION_MODE:-demo}
  LOG_LEVEL: INFO
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: nanfo
  POSTGRES_USER: nanfo_runtime
  REDIS_HOST: redis
  # C24: the Redis `default` user is disabled; every client authenticates as `nanfo`.
  REDIS_USERNAME: nanfo
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  CORS_ALLOW_ORIGINS: http://127.0.0.1:${NANFO_HTTP_PORT:-8787}
  REPORTS_STORAGE_PATH: /var/lib/nanfo/reports
  NETWORK_ASSET_ROOT: /var/lib/nanfo/network-assets
  REPORTS_MIN_FREE_BYTES: ${REPORTS_MIN_FREE_BYTES:-67108864}
  TELEMETRY_RUNTIME_ADAPTER_MODE: ${TELEMETRY_RUNTIME_ADAPTER_MODE:-stub}
  API_REALTIME_DISTRIBUTED: ${API_REALTIME_DISTRIBUTED:-false}
  EMULATION_CONTROL_ENABLED: ${EMULATION_CONTROL_ENABLED:-false}
  EMULATION_SNAPSHOT_PATH: /var/lib/nanfo/lab/output/snapshot.json
  EMULATION_BINDING_PATH: /var/lib/nanfo/binding/binding.json
  EMULATION_COMMANDS_PATH: /var/lib/nanfo/lab/commands
  EMULATION_RESULTS_PATH: /var/lib/nanfo/lab/results
  # The only heartbeat setting read by the backend (app/core/runtime_health.py) and
  # by deploy/supervise.py; each loop appends ".<loop>" under the private tmpfs.
  WORKER_HEARTBEAT_PATH: /run/nanfo/heartbeat.json

x-application: &application
  image: ${NANFO_BACKEND_IMAGE:?Initialize configuration}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
    target: runtime
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    - /run/nanfo:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
  environment: *environment
  networks: [private]
  # Restarts every exit, including watchdog exit 70 and retention refusal exit 3.
  restart: unless-stopped
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.0
  stop_grace_period: 45s
  logging: *logging
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    neo4j: {condition: service_healthy}
  # Worker secret volume: no JWT signing key (C24). The API overrides it.
  volumes:
    - runtime_secrets_worker:/run/secrets:ro

services:
  volume-init:
    image: ${NANFO_BACKEND_IMAGE:?Initialize configuration}
    profiles: [init]
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, /opt/nanfo/deploy/volume_init.py]
    environment:
      APP_ENV: production
      NANFO_SERVICE_ROLE: worker
    volumes:
      - ${NANFO_STATE_DIR:?Initialize configuration}/secrets:/source-secrets:ro
      - reports:/volumes/reports
      - network_assets:/volumes/network_assets
      - telemetry_archive:/volumes/telemetry_archive
      - stream_archive:/volumes/stream_archive
      - lab_output:/volumes/lab_output
      - lab_commands:/volumes/lab_commands
      - lab_results:/volumes/lab_results
      - runtime_secrets_api:/volumes/runtime_secrets_api
      - runtime_secrets_worker:/volumes/runtime_secrets_worker
      - execution_secrets:/volumes/execution_secrets
      - lab_secrets:/volumes/lab_secrets
      - init_secrets:/volumes/init_secrets
    logging: *logging
    pids_limit: 32
    mem_limit: 128m
  initialize:
    <<: *application
    profiles: [init]
    restart: "no"
    command: [python, /opt/nanfo/deploy/initialize.py]
    environment:
      <<: *environment
      # Fresh-only initializer: the init volume holds every staged secret.
      NANFO_SERVICE_ROLE: api
      NANFO_BOOTSTRAP_EMAIL: ${NANFO_BOOTSTRAP_EMAIL:?Initialize configuration}
    volumes:
      - init_secrets:/run/secrets:ro
  # Operator-only store credential rotation (manage.py rotate); never a lifecycle service.
  secret-rotation:
    <<: *application
    profiles: [rotation]
    restart: "no"
    command: [python, /opt/nanfo/deploy/secret_rotation.py, --help]
    environment:
      <<: *environment
      NANFO_SERVICE_ROLE: api
    volumes:
      - init_secrets:/run/secrets:ro

  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    # Connection budget (deploy/README.md "Capacity Limits"): API/api2 and every
    # worker pool 5 + 5 overflow, retention/probes/maintenance, 3 superuser slots.
    command: [postgres, -c, max_connections=200]
    environment:
      POSTGRES_DB: nanfo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_admin_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m", "/var/run/postgresql:rw,noexec,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    # One backend process per connection: max_connections + background/parallel workers.
    pids_limit: 300
    shm_size: 128m
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d nanfo"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    # Entrypoint baked into the image (Dockerfile.redis); no working-tree bind mount.
    image: ${NANFO_REDIS_IMAGE:?Initialize configuration}
    build: {context: .., dockerfile: deploy/Dockerfile.redis}
    secrets: [redis_password, redis_admin_password]
    volumes: [redis_data:/data]
    networks: [private]
    read_only: true
    tmpfs: ["/run/redis:rw,noexec,nosuid,nodev,size=1m", "/tmp:rw,noexec,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      # The operator ACL user is never rotated in place, so the probe survives a
      # `nanfo` password rotation that replaces this container's secret file.
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_admin_password) redis-cli --no-auth-warning --user nanfo-admin ping | test "$$(cat)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 30
  neo4j:
    image: ${NANFO_NEO4J_IMAGE:?Initialize configuration}
    build: {context: .., dockerfile: deploy/Dockerfile.neo4j}
    secrets: [neo4j_password]
    environment:
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_server_directories_run: /tmp/run
      NEO4J_server_bolt_tls__level: DISABLED
      NEO4J_db_tx__log_rotation_retention__policy: 2 days 256M
    volumes: [neo4j_data:/data]
    networks: [private]
    read_only: true
    tmpfs:
      # Neo4j's bundled JNA extracts a native library here. API/workers stay noexec.
      - /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777
      - /logs:rw,noexec,nosuid,nodev,size=64m,uid=7474,gid=7474
      - /var/lib/neo4j/conf:rw,noexec,nosuid,nodev,size=8m,uid=7474,gid=7474
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 90s
    logging: *logging
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:7474/]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    <<: *application
    # Only nginx's exact address on the isolated proxy network is trusted.
    environment:
      <<: *environment
      NANFO_SERVICE_ROLE: api
      FORWARDED_ALLOW_IPS: ${NANFO_PROXY_GATEWAY_IP:-172.30.27.2}
    networks: [private, proxy]
    volumes:
      - runtime_secrets_api:/run/secrets:ro
      - reports:/var/lib/nanfo/reports:ro
      - network_assets:/var/lib/nanfo/network-assets
      - lab_output:/var/lib/nanfo/lab/output:ro
      - lab_commands:/var/lib/nanfo/lab/commands:ro
      - lab_results:/var/lib/nanfo/lab/results:ro
      - type: bind
        source: ${NANFO_STATE_DIR}/binding
        target: /var/lib/nanfo/binding
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      # Readiness is private: the gateway answers /ready with 404 (deploy/nginx.conf).
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).read()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
  maintenance:
    <<: *application
    profiles: [maintenance]
    restart: "no"
    command: [python, /opt/nanfo/deploy/maintenance.py, checkpoint]
    volumes:
      - runtime_secrets_worker:/run/secrets:ro
      - reports:/var/lib/nanfo/reports:ro
      - network_assets:/var/lib/nanfo/network-assets:ro
      - telemetry_archive:/var/lib/nanfo/telemetry-archive:ro
      - lab_output:/var/lib/nanfo/lab/output:ro
      - lab_commands:/var/lib/nanfo/lab/commands:ro
      - lab_results:/var/lib/nanfo/lab/results:ro
      - type: bind
        source: ${NANFO_STATE_DIR}/binding
        target: /var/lib/nanfo/binding
        read_only: true
        bind: {create_host_path: false}
  # C14: supervised archive-before-delete retention of every domain stream and the DLQ.
  stream-retention:
    <<: *application
    command:
      [python, /opt/nanfo/deploy/supervise.py, run, --loop, stream-retention, --,
       python, -m, scripts.stream_retention, schedule]
    environment:
      <<: *environment
      NANFO_STREAM_ARCHIVE_ROOT: /var/lib/nanfo/stream-archive
      NANFO_STREAM_RETENTION_INTERVAL_SECONDS: ${NANFO_STREAM_RETENTION_INTERVAL_SECONDS:-300}
      NANFO_STREAM_RETENTION_MAX_ENTRIES: ${NANFO_STREAM_RETENTION_MAX_ENTRIES:-1000}
      NANFO_STREAM_RETENTION_MIN_AGE_SECONDS: ${NANFO_STREAM_RETENTION_MIN_AGE_SECONDS:-86400}
      NANFO_STREAM_RETENTION_DLQ_MIN_AGE_SECONDS: ${NANFO_STREAM_RETENTION_DLQ_MIN_AGE_SECONDS:-604800}
      NANFO_STREAM_RETENTION_MIN_FREE_BYTES: ${NANFO_STREAM_RETENTION_MIN_FREE_BYTES:-1073741824}
      NANFO_STREAM_RETENTION_MAX_REFUSALS: ${NANFO_STREAM_RETENTION_MAX_REFUSALS:-5}
    volumes:
      - runtime_secrets_worker:/run/secrets:ro
      - stream_archive:/var/lib/nanfo/stream-archive
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/supervise.py, check, --loop, stream-retention]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  # BE-Telemetry supervised retention loop; the DSN is derived from staged secrets.
  telemetry-retention:
    <<: *application
    command:
      [python, /opt/nanfo/deploy/supervise.py, run, --loop, telemetry-retention, --,
       python, scripts/telemetry_retention.py, apply, --loop,
       --archive-root, /var/lib/nanfo/telemetry-archive]
    environment:
      <<: *environment
      NANFO_TELEMETRY_RETENTION_DSN_FROM_SECRETS: "true"
      NANFO_TELEMETRY_RETENTION_INTERVAL_SECONDS: ${NANFO_TELEMETRY_RETENTION_INTERVAL_SECONDS:-3600}
      NANFO_TELEMETRY_RETENTION_MIN_AGE_DAYS: ${NANFO_TELEMETRY_RETENTION_MIN_AGE_DAYS:-30}
    volumes:
      - runtime_secrets_worker:/run/secrets:ro
      - telemetry_archive:/var/lib/nanfo/telemetry-archive
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/supervise.py, check, --loop, telemetry-retention]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  # Finite operator invocations of the same CLI (dry-run/restore/reconcile/fixtures).
  telemetry-retention-cli:
    <<: *application
    profiles: [retention]
    restart: "no"
    command: [python, /opt/nanfo/deploy/telemetry_retention.py]
    volumes:
      - runtime_secrets_worker:/run/secrets:ro
      - telemetry_archive:/var/lib/nanfo/telemetry-archive
  network-outbox-worker:
    <<: *application
    command: [python, -m, scripts.run_network_outbox_worker]
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/entrypoint.py, python, scripts/check_worker_health.py, --worker, network]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
  simulation-worker:
    <<: *application
    command: [python, scripts/run_simulation_worker.py]
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/entrypoint.py, python, scripts/check_worker_health.py, --worker, simulation]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
  report-worker:
    <<: *application
    command: [python, scripts/run_report_worker.py]
    volumes:
      - runtime_secrets_worker:/run/secrets:ro
      - reports:/var/lib/nanfo/reports
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/entrypoint.py, python, scripts/check_worker_health.py, --worker, report]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
  alert-worker:
    <<: *application
    command: [python, scripts/run_alert_worker.py]
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/entrypoint.py, python, scripts/check_worker_health.py, --worker, alert]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
  execution-worker:
    <<: *application
    command: [python, scripts/run_execution_worker.py]
    environment:
      <<: *environment
      # C15: HMAC key for mailbox command envelopes (execution worker + lab only).
      NANFO_LAB_COMMAND_KEY_FILE: /run/nanfo-lab-key/lab_command_key
      # Command files 0640: a C23 lab without DAC_OVERRIDE reads them via group 10001.
      NANFO_UMASK: "027"
    volumes:
      - runtime_secrets_worker:/run/secrets:ro
      - execution_secrets:/run/nanfo-lab-key:ro
      - lab_output:/var/lib/nanfo/lab/output:ro
      - lab_commands:/var/lib/nanfo/lab/commands
      - lab_results:/var/lib/nanfo/lab/results:ro
      - type: bind
        source: ${NANFO_STATE_DIR}/binding
        target: /var/lib/nanfo/binding
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/entrypoint.py, python, scripts/check_worker_health.py, --worker, execution]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
  autonomy-worker:
    <<: *application
    command: [python, scripts/run_autonomy_worker.py]
    volumes:
      - runtime_secrets_worker:/run/secrets:ro
      - lab_output:/var/lib/nanfo/lab/output:ro
      - lab_commands:/var/lib/nanfo/lab/commands:ro
      - lab_results:/var/lib/nanfo/lab/results:ro
      - type: bind
        source: ${NANFO_STATE_DIR}/binding
        target: /var/lib/nanfo/binding
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/entrypoint.py, python, scripts/check_worker_health.py, --worker, autonomy]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 30s
  gateway:
    image: ${NANFO_FRONTEND_IMAGE:?Initialize configuration}
    build: {context: .., dockerfile: deploy/Dockerfile.frontend}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
    environment:
      # R06: the host TLS proxy reaches nginx through the loopback-published port,
      # i.e. from this bridge's gateway address. Only that hop may supply
      # X-Forwarded-For/-Proto; every other peer's headers are ignored.
      NANFO_GATEWAY_TRUSTED_HOP: ${NANFO_GATEWAY_BRIDGE_IP:-172.31.87.1}
      NANFO_GATEWAY_UPSTREAM: single
    ports: ["127.0.0.1:${NANFO_HTTP_PORT:-8787}:8080"]
    networks:
      proxy:
        ipv4_address: ${NANFO_PROXY_GATEWAY_IP:-172.30.27.2}
      gateway: {}
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    healthcheck:
      # nginx itself (static shell); API health is the API container's own probe.
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/index.html]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  private: {internal: true}
  # Configure a distinct unused subnet/address pair for concurrent deployments.
  # No stores/workers or published API ports belong to this boundary.
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${NANFO_PROXY_SUBNET:-172.30.27.0/24}
  # Pinned so the published port's source address (the bridge gateway) is known.
  gateway:
    ipam:
      config:
        - subnet: ${NANFO_GATEWAY_SUBNET:-172.31.87.0/24}
          gateway: ${NANFO_GATEWAY_BRIDGE_IP:-172.31.87.1}
volumes:
  postgres_data: {}
  redis_data: {}
  neo4j_data: {}
  reports: {}
  network_assets: {}
  telemetry_archive: {}
  stream_archive: {}
  lab_output: {}
  lab_commands: {}
  lab_results: {}
  runtime_secrets_api: {}
  runtime_secrets_worker: {}
  execution_secrets: {}
  lab_secrets: {}
  init_secrets: {}
secrets:
  postgres_admin_password: {file: "${NANFO_STATE_DIR}/secrets/postgres_admin_password"}
  redis_password: {file: "${NANFO_STATE_DIR}/secrets/redis_password"}
  redis_admin_password: {file: "${NANFO_STATE_DIR}/secrets/redis_admin_password"}
  neo4j_password: {file: "${NANFO_STATE_DIR}/secrets/neo4j_password"}
