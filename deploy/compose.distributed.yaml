# Apply to the entire serving pool, never start a second legacy singleton API.
services:
  api:
    environment:
      API_REALTIME_DISTRIBUTED: "true"
  api2:
    extends: {file: compose.yaml, service: api}
    environment:
      API_REALTIME_DISTRIBUTED: "true"
  gateway:
    depends_on:
      api2: {condition: service_healthy}
    environment:
      # Selects the upstream file baked into the gateway image; no checkout bind mount.
      NANFO_GATEWAY_UPSTREAM: distributed
