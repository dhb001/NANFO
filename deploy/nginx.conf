# NANFO production gateway, baked into the frontend image (never bind-mounted).
# deploy/gateway-entrypoint.sh renders /tmp/nginx/{upstream.conf,realip.conf,
# trusted-hop.map} from validated environment values before nginx starts.
# Read-only root: every runtime path lives under the private /tmp tmpfs.
worker_processes 1;
pid /tmp/nginx.pid;
# Process-level messages only. Request-scoped records embed the raw request line
# (including query strings), so the server below logs requests at crit.
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 4096;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Proxied responses (report downloads) are never spooled to temporary files.
    proxy_max_temp_file_size 0;

    # R06: behind the loopback-published port every client arrives from the Docker
    # bridge gateway, where the documented host TLS proxy connects. Only that hop
    # (NANFO_GATEWAY_TRUSTED_HOP, rendered at start) may supply X-Forwarded-For or
    # X-Forwarded-Proto; without a rendered hop nobody is trusted.
    include /tmp/nginx/realip*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    map $realip_remote_addr $nanfo_trusted_hop {
        default 0;
        include /tmp/nginx/trusted-hop*.map;
    }
    map "$nanfo_trusted_hop:$http_x_forwarded_proto" $nanfo_forwarded_proto {
        default $scheme;
        "1:https" https;
        "1:http" http;
    }
    # A well-formed client X-Request-ID is kept for correlation, otherwise nginx's own.
    map $http_x_request_id $nanfo_request_id {
        default $request_id;
        "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Never log $request, $request_uri, $args, Referer or query parameters (WS tokens).
    log_format safe escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$nanfo_request_id","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout safe;

    # Edge login throttle per real client (after realip); the API keeps its own
    # per-IP and per-email buckets (C11). 429 bodies use the standard envelope.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    # Static assets only: every proxied location switches compression off (BREACH).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               image/svg+xml application/wasm application/manifest+json;

    include /etc/nginx/nginx-upstream.conf;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        error_log /dev/stderr crit;
        log_not_found off;
        client_max_body_size 20m;
        # add_header is inherited only by levels that define none, so every location
        # below includes the complete security header set explicitly.
        include /etc/nginx/nginx-security-headers.conf;

        # Readiness is private: container healthchecks and the verifier call the API directly.
        location = /ready {
            include /etc/nginx/nginx-security-headers.conf;
            return 404;
        }
        location ~ \.map$ {
            include /etc/nginx/nginx-security-headers.conf;
            return 404;
        }
        # The production gateway never exposes OpenAPI/Swagger, whatever API_DOCS_ENABLED says.
        location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
            include /etc/nginx/nginx-security-headers.conf;
            return 404;
        }
        location = /api/v1/auth/login {
            include /etc/nginx/nginx-security-headers.conf;
            limit_req zone=login burst=5 nodelay;
            error_page 429 = @login_throttled;
            include /etc/nginx/nginx-proxy.conf;
        }
        location /api/ {
            include /etc/nginx/nginx-security-headers.conf;
            include /etc/nginx/nginx-proxy.conf;
        }
        location /ws/ {
            include /etc/nginx/nginx-security-headers.conf;
            include /etc/nginx/nginx-proxy.conf;
        }
        location = /health {
            include /etc/nginx/nginx-security-headers.conf;
            include /etc/nginx/nginx-proxy.conf;
        }
        location @login_throttled {
            include /etc/nginx/nginx-security-headers.conf;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "6" always;
            return 429 '{"success":false,"data":null,"meta":{"request_id":"$nanfo_request_id","timestamp":"$time_iso8601"},"errors":{"code":"RATE_LIMITED","message":"Too many login attempts. Please try again later."}}';
        }
        # Hashed build output: immutable, and a missing asset is a 404, never the SPA shell.
        location /assets/ {
            include /etc/nginx/nginx-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location = /index.html {
            include /etc/nginx/nginx-security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
        location / {
            include /etc/nginx/nginx-security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
