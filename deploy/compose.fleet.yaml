# Explicit operator-provisioned fleet; combine AFTER distributed overlay if used.
# Restrict the collector's egress to SNMP (UDP/161) with the host DOCKER-USER rules in
# deploy/NETSNMP.md; they match the pinned NANFO_FLEET_EGRESS_SUBNET below.
services:
  api:
    environment:
      TELEMETRY_FLEET_ENABLED: "true"
      TELEMETRY_RUNTIME_ADAPTER_MODE: stub
  fleet-worker:
    extends: {file: compose.yaml, service: network-outbox-worker}
    profiles: [fleet]
    image: ${NANFO_FLEET_IMAGE:?Set a distinct source-matched with-fleet image}
    platform: linux/amd64
    build: {target: with-fleet}
    command: [python, -m, scripts.run_fleet_collector]
    environment:
      NANFO_FLEET_MANIFEST_PATH: /var/lib/nanfo/fleet/manifest.json
      # Per-request SNMPv3 USM config files live only in this private memory-backed base
      # (backend/app/modules/telemetry/snmp_transport.py requires 0700 owned by the UID).
      NANFO_SNMP_RUNTIME_DIR: /run/nanfo-snmp
    # The inherited scratch mounts are restated verbatim so the merged list is identical
    # whether Compose merges or replaces tmpfs sequences; only the SNMP base is new.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /run/nanfo:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
      - /run/nanfo-snmp:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
    networks: [fleet_egress]
    volumes:
      - type: bind
        source: ${NANFO_STATE_DIR}/fleet
        target: /var/lib/nanfo/fleet
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${NANFO_STATE_DIR}/fleet-credentials
        target: /var/lib/nanfo/fleet-credentials
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, /opt/nanfo/deploy/entrypoint.py, python, /opt/nanfo/deploy/check_fleet_health.py]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 60s
networks:
  # Pinned so the host egress firewall keeps matching after the network is recreated
  # (an unpinned bridge could move to a new subnet and silently escape the rules).
  fleet_egress:
    ipam:
      config:
        - subnet: ${NANFO_FLEET_EGRESS_SUBNET:?Pin the fleet egress subnet used by the DOCKER-USER rules (deploy/NETSNMP.md)}
