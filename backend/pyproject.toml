[tool.poetry]
name = "nanfo-backend"
version = "0.1.0"
description = "NANFO — Network AI & Neural Fabric Orchestrator. Backend API service."
authors = ["NANFO Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "~0.135.4"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
neo4j = "^5.26.0"
redis = {extras = ["asyncio"], version = "^5.2.0"}
pyjwt = "^2.13.0"
cryptography = "^50.0.0"
bcrypt = "^4.0.1"
structlog = ">=24.4,<27.0"
httpx = "^0.28.0"
psycopg2-binary = "^2.9.10"
email-validator = "^2.0.0"
reportlab = "5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^6.0.0"
fakeredis = {extras = ["aioredis", "lua"], version = "^2.26.0"}
anyio = {extras = ["trio"], version = "^4.6.0"}
pypdf = "6.19.0"
ruff = "0.15.6"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "--cov=app --cov-report=term-missing"
markers = [
  "private_artifacts: reads ignored local evidence under ai-engine/artifacts; skipped when absent, deselected in portable CI (ADR-028)",
]
filterwarnings = [
  'ignore:.*iscoroutinefunction.*:DeprecationWarning:neo4j\._meta',
  'ignore:.*iscoroutinefunction.*:DeprecationWarning:fastapi\.routing',
  'ignore:.*iscoroutinefunction.*:DeprecationWarning:pytest_asyncio\.plugin',
  'ignore:.*get_event_loop_policy.*:DeprecationWarning:pytest_asyncio\.plugin',
  'ignore:.*set_event_loop_policy.*:DeprecationWarning:pytest_asyncio\.plugin',
]

[tool.coverage.run]
omit = ["tests/*", "alembic/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
